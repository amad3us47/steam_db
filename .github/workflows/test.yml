name: Steam Scraper max
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        id: scrape
        timeout-minutes: 260   # leaves ~10 min buffer to commit before 270 job cap
        continue-on-error: true
        run: python test/main.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add test/games.db test/progress.txt
          git commit -m "Update games.db and progress" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Fail job if scraper errored
        if: steps.scrape.outcome == 'failure'
        run: exit 1
